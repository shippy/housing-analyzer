[project]
name = "housing-analyzer"
version = "0.1.0"
description = "Prague Buy vs Rent+Invest Analyzer using PyMC probabilistic modeling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "marimo>=0.10.0",
    "pymc>=5.10.0",
    "arviz>=0.17.0",
    "polars>=0.20.0",
    "plotly>=5.18.0",
    "httpx>=0.26.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.12.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
